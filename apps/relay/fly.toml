# fly launch --no-deploy --copy-config; then: fly secrets set DEEPGRAM_API_KEY=... GROQ_API_KEY=... ELEVENLABS_API_KEY=... RELAY_TOKENS=...
app = "nyv-relay"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"
  # Build context is the repo root (run `fly deploy` from the repo root with `-c apps/relay/fly.toml`).

[env]
  ASR_PROVIDER = "deepgram"
  MT_PROVIDER = "groq"
  TTS_PROVIDER = "elevenlabs"
  MAX_SESSIONS = "50"
  MAX_SESSIONS_PER_IP = "3"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8787
  force_https = true
  # Sessions are long-lived WebSockets; never stop the last machine under a live call.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
