<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; } html, body { margin: 0; }
  body { width: 440px; height: 280px; overflow: hidden; background: #eff1ed; font-family: Inter, system-ui, sans-serif; color: #15130f; position: relative; }
  .mark { position: absolute; left: 32px; top: 30px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 20px; }
  h1 { position: absolute; left: 32px; top: 90px; margin: 0; font-size: 34px; line-height: 1.02; letter-spacing: -0.02em; font-weight: 600; }
  h1 em { display: block; font: italic 400 1em/1.02 "Instrument Serif", Georgia, serif; color: #e2552b; }
  .line { position: absolute; left: 32px; right: 32px; bottom: 28px; display: grid; grid-template-columns: auto auto auto; justify-content: space-between; gap: 10px; align-items: center; font-size: 12.5px; white-space: nowrap; color: #4a4e47; }
  .line b { font-weight: 500; color: #15130f; }
  .line .hi { font-family: "Noto Sans Devanagari", "Noto Serif Devanagari", sans-serif; }
  .line .arrow { color: #e2552b; font-size: 16px; }
</style></head><body>
  <div class="mark"><svg width="30" height="30" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#15130f"/><g fill="#f7f4ee"><rect x="12" y="23" width="6" height="18" rx="3"/><rect x="21.5" y="16" width="6" height="32" rx="3"/><rect x="36.5" y="16" width="6" height="32" rx="3"/><rect x="46" y="23" width="6" height="18" rx="3"/></g><rect x="29" y="9" width="6" height="46" rx="3" fill="#e2552b"/></svg>nyv</div>
  <h1>Hear every call<em>in your language.</em></h1>
  <div class="line"><span><b>"Does that work for you?"</b></span><span class="arrow">→ 0.7 s →</span><span class="hi"><b>क्या यह आपके लिए ठीक है?</b></span></div>
</body></html>
