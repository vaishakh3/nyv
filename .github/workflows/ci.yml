name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @nyv/extension build
      - name: Latency regression gate (mock providers)
        run: pnpm bench --runs 3 --speed 4 --baseline tools/bench/baseline.json --tolerance 0.15 --out bench-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-result
          path: bench-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: apps/extension/dist/chrome-mv3
